<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 14" width="1200" height="14" role="presentation">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#548D7B" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#548D7B" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#548D7B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7FB5A1" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#7FB5A1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7FB5A1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="6" width="1200" height="1.2" fill="url(#base)"/>
  <rect x="-300" y="5.5" width="300" height="2" fill="url(#pulse)">
    <animate attributeName="x" from="-300" to="1200" dur="6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="6.6" r="2.6" fill="#548D7B">
    <animate attributeName="r" values="2.6;4;2.6" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.45;1" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
