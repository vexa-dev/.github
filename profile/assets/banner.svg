<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="VEXA — Software a tu medida">
  <title>VEXA — Software a tu medida</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0e1614"/>
      <stop offset="38%"  stop-color="#0a0d0c"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%"   stop-color="#548D7B" stop-opacity="0.50"/>
      <stop offset="50%"  stop-color="#548D7B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#548D7B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="60%"  stop-color="#E8F0ED"/>
      <stop offset="100%" stop-color="#9FBFB4"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7FB5A1" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#A8D5C4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7FB5A1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#548D7B" stop-opacity="0"/>
      <stop offset="22%"  stop-color="#548D7B" stop-opacity="0.5"/>
      <stop offset="78%"  stop-color="#548D7B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#548D7B" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.026" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <clipPath id="typeClip">
      <rect x="292" y="168" width="0" height="30">
        <animate attributeName="width" values="0;0;218;218;0"
                 keyTimes="0;0.14;0.44;0.93;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="frame"><rect width="1000" height="300" rx="18"/></clipPath>

    <style>
      .rise { opacity: 0; animation: rise .9s cubic-bezier(.22,1,.36,1) forwards }
      @keyframes rise { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
      .d1{animation-delay:.10s} .d2{animation-delay:.26s} .d3{animation-delay:.44s}
      .d4{animation-delay:.62s} .d5{animation-delay:.80s} .d6{animation-delay:.96s}

      .mark { opacity: 0; transform-box: fill-box; transform-origin: center;
              animation: pop 1.1s cubic-bezier(.22,1,.36,1) forwards }
      @keyframes pop { from { opacity: 0; transform: scale(.86) } to { opacity: 1; transform: scale(1) } }

      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 7s ease-in-out infinite }
      @keyframes breathe { 0%,100% { opacity:.6; transform: scale(1) } 50% { opacity:1; transform: scale(1.05) } }

      .orbit { transform-box: fill-box; transform-origin: center; animation: orbit 22s linear infinite }
      @keyframes orbit { to { transform: rotate(360deg) } }

      .orbit-rev { transform-box: fill-box; transform-origin: center; animation: orbit 34s linear infinite reverse }

      .caret { animation: blink 1s steps(1) infinite }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

      @media (prefers-reduced-motion: reduce) {
        .rise, .mark { opacity: 1; animation: none }
        .breathe, .orbit, .orbit-rev, .caret { animation: none }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <ellipse cx="160" cy="150" rx="205" ry="170" fill="url(#halo)" class="breathe"/>

    <!-- constelación decorativa derecha -->
    <g opacity="0.5">
      <g class="orbit-rev">
        <circle cx="880" cy="150" r="118" fill="none" stroke="#548D7B" stroke-opacity="0.16"
                stroke-width="1" stroke-dasharray="3 9"/>
      </g>
      <circle cx="880" cy="150" r="72" fill="none" stroke="#548D7B" stroke-opacity="0.10" stroke-width="1"/>
      <circle cx="808" cy="150" r="2.4" fill="#7FB5A1" opacity="0.9"/>
      <circle cx="952" cy="150" r="1.8" fill="#548D7B" opacity="0.7"/>
      <circle cx="880" cy="78"  r="1.8" fill="#548D7B" opacity="0.7"/>
    </g>
    <rect x="760" y="0" width="240" height="300" fill="url(#fadeR)" opacity="0.55"/>

    <!-- anillo del logo -->
    <g class="mark">
      <circle cx="160" cy="150" r="104" fill="none" stroke="#548D7B" stroke-opacity="0.18" stroke-width="1"/>
      <g class="orbit">
        <circle cx="160" cy="150" r="104" fill="none" stroke="#7FB5A1" stroke-opacity="0.8"
                stroke-width="1.7" stroke-linecap="round" stroke-dasharray="58 595"/>
      </g>
    </g>

    <!-- isotipo -->
    <g class="mark"><g transform="translate(160 150) scale(0.163) translate(-500 -500)">
      <g filter="url(#glow)" opacity="0.55">
        <path fill="#548D7B" d="M520.87,568.65c4.85,16.12,51.3,106.57,53.08,110.26.08.08.38.42,1.12.54.7.1,1.38-.26,1.99-.89.83-.92,1.23-2,1.56-2.84.74-1.88,174.97-349.06,181.14-359.4,2.6-4.78,21.43-32.3,22.4-34.11.39-.73,1.76-3.69,2.75-7.46,1.3-5.01,1.41-8.16-2.1-11.86s-11.39-.75-14.89.25c-3.36,1.03-6.93,2.55-10.21,4.09-16.07,7.89-45.43,24.95-63.73,36.18-9.14,5.7-19.63,12.07-29.88,21.01-10.53,9.29-25.66,24.69-34.76,36.23-6.22,8.37-9.57,13.58-18.81,26.92-12.16,17.89-42.84,75.47-45.92,81.45-14.85,28.8-30.94,55.22-36.47,67.44-5.21,11.14-10.83,19.72-7.28,32.03l.04.14Z"/>
      </g>
      <path fill="#ffffff" d="M500,5.66C226.98,5.66,5.66,226.98,5.66,500s221.32,494.34,494.34,494.34,494.34-221.32,494.34-494.34S773.02,5.66,500,5.66ZM500,939.59c-242.78,0-439.59-196.81-439.59-439.59S257.22,60.41,500,60.41s439.59,196.81,439.59,439.59-196.81,439.59-439.59,439.59Z"/>
      <path fill="#ffffff" d="M220.43,331.76h140.68s18.38,2.04,26.55,24.51,165.51,346.98,165.51,346.98c0,0,8.23,15.13,1.15,27.19-7.09,12.06-21.26,42.13-21.26,42.13l-11.3,19.34s-5.36,6.13-9.77,10.72c-4.4,4.6-8.62,5.94-11.3,6.13s-10.15.77-12.26,0-7.66-1.15-19.53-27.57-179.23-367.09-179.23-367.09c0,0-4.4-12.83-22.6-27.19s-45.77-37.53-47.87-41.74-7.85-13.6,0-13.4"/>
      <path fill="#548D7B" d="M520.87,568.65c4.85,16.12,51.3,106.57,53.08,110.26.08.08.38.42,1.12.54.7.1,1.38-.26,1.99-.89.83-.92,1.23-2,1.56-2.84.74-1.88,174.97-349.06,181.14-359.4,2.6-4.78,21.43-32.3,22.4-34.11.39-.73,1.76-3.69,2.75-7.46,1.3-5.01,1.41-8.16-2.1-11.86s-11.39-.75-14.89.25c-3.36,1.03-6.93,2.55-10.21,4.09-16.07,7.89-45.43,24.95-63.73,36.18-9.14,5.7-19.63,12.07-29.88,21.01-10.53,9.29-25.66,24.69-34.76,36.23-6.22,8.37-9.57,13.58-18.81,26.92-12.16,17.89-42.84,75.47-45.92,81.45-14.85,28.8-30.94,55.22-36.47,67.44-5.21,11.14-10.83,19.72-7.28,32.03l.04.14Z"/>
    </g></g>

    <!-- eyebrow -->
    <g class="rise d1">
      <rect x="292" y="66" width="3" height="14" rx="1.5" fill="#548D7B"/>
      <text x="305" y="78" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif"
            font-size="12.5" font-weight="700" letter-spacing="3.6" fill="#7FB5A1">INGENIERÍA DE SOFTWARE</text>
    </g>

    <!-- wordmark -->
    <text class="rise d2" x="292" y="146"
          font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif"
          font-size="76" font-weight="700" letter-spacing="11" fill="url(#wordGrad)">VEXA</text>

    <!-- línea tipeada -->
    <g class="rise d3">
      <text x="292" y="192" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif"
            font-size="25" font-weight="600" fill="#F1F5F9" opacity="0.09">Software a tu medida</text>
      <g clip-path="url(#typeClip)">
        <text x="292" y="192" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif"
              font-size="25" font-weight="600" fill="#F1F5F9">Software a tu medida</text>
      </g>
      <rect class="caret" x="294" y="170" width="2.5" height="26" fill="#7FB5A1">
        <animate attributeName="x" values="294;294;510;510;294"
                 keyTimes="0;0.14;0.44;0.93;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- metadatos -->
    <g class="rise d4" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif"
       font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#64748B">
      <text x="292" y="236">PERÚ</text>
      <circle cx="350" cy="232" r="2" fill="#548D7B"/>
      <text x="366" y="236">VEXA.SPACE</text>
      <circle cx="476" cy="232" r="2" fill="#548D7B"/>
      <text x="492" y="236">DESDE 2025</text>
    </g>

    <!-- regla inferior + barrido -->
    <rect x="0" y="297" width="1000" height="1.4" fill="url(#rule)"/>
    <rect x="-360" y="296.3" width="360" height="2.6" fill="url(#sweep)">
      <animate attributeName="x" from="-360" to="1000" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
