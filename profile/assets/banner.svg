<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="VEXA — Ingeniería de software a medida">
  <title>VEXA — Ingeniería de software a medida</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1311"/>
      <stop offset="45%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#548D7B" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#548D7B" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#548D7B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#548D7B" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#7FB5A1" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#7FB5A1" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#548D7B" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#548D7B" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#548D7B" stop-opacity="0.55"/>
      <stop offset="82%"  stop-color="#548D7B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#548D7B" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <clipPath id="typeClip">
      <rect x="352" y="196" width="0" height="34">
        <animate attributeName="width"
                 values="0;0;186;186;0"
                 keyTimes="0;0.16;0.46;0.92;1"
                 dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="340" rx="18"/>
    </clipPath>

    <style>
      .rise   { opacity: 0; animation: rise 0.9s cubic-bezier(.22,1,.36,1) forwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .35s }
      .d3 { animation-delay: .55s } .d4 { animation-delay: .75s } .d5 { animation-delay: .95s }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }

      .mark   { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop 1.1s cubic-bezier(.22,1,.36,1) forwards; }
      @keyframes pop { from { opacity: 0; transform: scale(.88) } to { opacity: 1; transform: scale(1) } }

      .breathe { animation: breathe 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes breathe { 0%,100% { opacity: .55; transform: scale(1) } 50% { opacity: 1; transform: scale(1.06) } }

      .spin   { transform-box: fill-box; transform-origin: center; animation: spin 26s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }

      .caret  { animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

      .chip   { opacity: 0; animation: rise .8s cubic-bezier(.22,1,.36,1) forwards; }

      @media (prefers-reduced-motion: reduce) {
        .rise, .mark, .chip { opacity: 1; animation: none }
        .breathe, .spin, .caret { animation: none }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <ellipse cx="196" cy="170" rx="230" ry="190" fill="url(#halo)" class="breathe"/>
    <ellipse cx="1080" cy="300" rx="260" ry="150" fill="url(#halo)" opacity="0.35"/>

    <!-- anillo orbital -->
    <g class="mark">
      <circle cx="196" cy="170" r="122" fill="none" stroke="#548D7B" stroke-opacity="0.22" stroke-width="1"/>
      <g class="spin">
        <circle cx="196" cy="170" r="122" fill="none" stroke="#7FB5A1" stroke-opacity="0.75"
                stroke-width="1.6" stroke-linecap="round" stroke-dasharray="70 697"/>
      </g>
    </g>

    <!-- isotipo VEXA -->
    <g class="mark"><g transform="translate(196 170) scale(0.19) translate(-500 -500)">
      <g filter="url(#soft)" opacity="0.5">
        <path fill="#548D7B" d="M520.87,568.65c4.85,16.12,51.3,106.57,53.08,110.26.08.08.38.42,1.12.54.7.1,1.38-.26,1.99-.89.83-.92,1.23-2,1.56-2.84.74-1.88,174.97-349.06,181.14-359.4,2.6-4.78,21.43-32.3,22.4-34.11.39-.73,1.76-3.69,2.75-7.46,1.3-5.01,1.41-8.16-2.1-11.86s-11.39-.75-14.89.25c-3.36,1.03-6.93,2.55-10.21,4.09-16.07,7.89-45.43,24.95-63.73,36.18-9.14,5.7-19.63,12.07-29.88,21.01-10.53,9.29-25.66,24.69-34.76,36.23-6.22,8.37-9.57,13.58-18.81,26.92-12.16,17.89-42.84,75.47-45.92,81.45-14.85,28.8-30.94,55.22-36.47,67.44-5.21,11.14-10.83,19.72-7.28,32.03l.04.14Z"/>
      </g>
      <path fill="#ffffff" d="M500,5.66C226.98,5.66,5.66,226.98,5.66,500s221.32,494.34,494.34,494.34,494.34-221.32,494.34-494.34S773.02,5.66,500,5.66ZM500,939.59c-242.78,0-439.59-196.81-439.59-439.59S257.22,60.41,500,60.41s439.59,196.81,439.59,439.59-196.81,439.59-439.59,439.59Z"/>
      <path fill="#ffffff" d="M220.43,331.76h140.68s18.38,2.04,26.55,24.51,165.51,346.98,165.51,346.98c0,0,8.23,15.13,1.15,27.19-7.09,12.06-21.26,42.13-21.26,42.13l-11.3,19.34s-5.36,6.13-9.77,10.72c-4.4,4.6-8.62,5.94-11.3,6.13s-10.15.77-12.26,0-7.66-1.15-19.53-27.57-179.23-367.09-179.23-367.09c0,0-4.4-12.83-22.6-27.19s-45.77-37.53-47.87-41.74-7.85-13.6,0-13.4"/>
      <path fill="#548D7B" d="M520.87,568.65c4.85,16.12,51.3,106.57,53.08,110.26.08.08.38.42,1.12.54.7.1,1.38-.26,1.99-.89.83-.92,1.23-2,1.56-2.84.74-1.88,174.97-349.06,181.14-359.4,2.6-4.78,21.43-32.3,22.4-34.11.39-.73,1.76-3.69,2.75-7.46,1.3-5.01,1.41-8.16-2.1-11.86s-11.39-.75-14.89.25c-3.36,1.03-6.93,2.55-10.21,4.09-16.07,7.89-45.43,24.95-63.73,36.18-9.14,5.7-19.63,12.07-29.88,21.01-10.53,9.29-25.66,24.69-34.76,36.23-6.22,8.37-9.57,13.58-18.81,26.92-12.16,17.89-42.84,75.47-45.92,81.45-14.85,28.8-30.94,55.22-36.47,67.44-5.21,11.14-10.83,19.72-7.28,32.03l.04.14Z"/>
    </g></g>

    <!-- eyebrow -->
    <g class="rise d1">
      <circle cx="360" cy="86" r="3.5" fill="#548D7B"/>
      <text x="376" y="91" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif"
            font-size="14" font-weight="600" letter-spacing="3.4" fill="#548D7B">
        INNOVACIÓN DIGITAL DE ELITE
      </text>
    </g>

    <!-- wordmark -->
    <text class="rise d2" x="352" y="168"
          font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif"
          font-size="82" font-weight="700" letter-spacing="10" fill="#ffffff">VEXA</text>

    <!-- línea tipeada -->
    <g class="rise d3">
      <text x="352" y="224" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif"
            font-size="27" font-weight="600" fill="#F1F5F9" opacity="0.10">Software a tu medida</text>
      <g clip-path="url(#typeClip)">
        <text x="352" y="224" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif"
              font-size="27" font-weight="600" fill="#F1F5F9">Software a tu medida</text>
      </g>
      <rect class="caret" x="352" y="200" width="3" height="28" fill="#548D7B">
        <animate attributeName="x" values="354;354;538;538;354"
                 keyTimes="0;0.16;0.46;0.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- chips -->
    <g class="chip d4" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" font-weight="600">
      <g>
        <rect x="352" y="256" width="126" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#548D7B" stroke-opacity="0.32"/>
        <text x="415" y="275.5" text-anchor="middle" fill="#CBD5E1" letter-spacing="0.6">Plataformas web</text>
      </g>
      <g>
        <rect x="488" y="256" width="104" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#548D7B" stroke-opacity="0.32"/>
        <text x="540" y="275.5" text-anchor="middle" fill="#CBD5E1" letter-spacing="0.6">Apps móviles</text>
      </g>
      <g>
        <rect x="602" y="256" width="118" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#548D7B" stroke-opacity="0.32"/>
        <text x="661" y="275.5" text-anchor="middle" fill="#CBD5E1" letter-spacing="0.6">ERP &amp; inventario</text>
      </g>
      <g>
        <rect x="730" y="256" width="92" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#548D7B" stroke-opacity="0.32"/>
        <text x="776" y="275.5" text-anchor="middle" fill="#CBD5E1" letter-spacing="0.6">Cloud &amp; CI/CD</text>
      </g>
    </g>

    <!-- dominio -->
    <text class="rise d5" x="1152" y="91" text-anchor="end"
          font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif"
          font-size="15" font-weight="600" letter-spacing="2" fill="#64748B">vexa.space</text>

    <!-- regla inferior + barrido -->
    <rect x="0" y="336" width="1200" height="1.5" fill="url(#rule)"/>
    <rect x="-420" y="335" width="420" height="2.5" fill="url(#sweep)">
      <animate attributeName="x" from="-420" to="1200" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
