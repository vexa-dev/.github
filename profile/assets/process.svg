<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Proceso de trabajo: consultoría, arquitectura, desarrollo, CI/CD y soporte">
  <title>Cómo trabajamos en VEXA</title>
  <defs>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#548D7B" stop-opacity="0.12"/>
      <stop offset="50%"  stop-color="#548D7B" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#548D7B" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="amb">
      <stop offset="0%" stop-color="#548D7B" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#548D7B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#FFFFFF" fill-opacity="0.03"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="220" rx="18"/></clipPath>
    <style>
      .step { opacity: 0; animation: pop .8s cubic-bezier(.22,1,.36,1) forwards }
      @keyframes pop { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
      .s1{animation-delay:.10s} .s2{animation-delay:.24s} .s3{animation-delay:.38s}
      .s4{animation-delay:.52s} .s5{animation-delay:.66s}
      .ico { stroke: #7FB5A1; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round }
      @media (prefers-reduced-motion: reduce) { .step { opacity: 1; animation: none } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="220" fill="#0a0a0a"/>
    <rect width="1000" height="220" fill="url(#dots)"/>
    <ellipse cx="500" cy="110" rx="470" ry="140" fill="url(#amb)"/>

    <!-- riel -->
    <rect x="96" y="103.2" width="808" height="1.6" rx="0.8" fill="url(#track)"/>
    <circle cx="96" cy="104" r="4" fill="#548D7B" opacity="0.6">
      <animate attributeName="cx" values="96;904" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="5.5s" repeatCount="indefinite"/>
    </circle>

    <!-- 01 Consultoría -->
    <g class="step s1">
      <circle cx="96" cy="104" r="27" fill="#121A1D" stroke="#548D7B" stroke-opacity="0.35"/>
      <circle cx="96" cy="104" r="27" fill="url(#gloss)"/>
      <g class="ico" transform="translate(85 93)">
        <path d="M11 1.8a6.2 6.2 0 0 0-3.5 11.3v2.1h7v-2.1A6.2 6.2 0 0 0 11 1.8Z"/>
        <path d="M8.6 18.2h4.8"/>
      </g>
      <text x="96" y="152" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,sans-serif"
            font-size="14" font-weight="700" fill="#F1F5F9">Consultoría</text>
      <text x="96" y="171" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,sans-serif"
            font-size="11.5" font-weight="600" fill="#4ADE80">Gratuita</text>
    </g>

    <!-- 02 Arquitectura -->
    <g class="step s2">
      <circle cx="298" cy="104" r="27" fill="#121A1D" stroke="#548D7B" stroke-opacity="0.35"/>
      <circle cx="298" cy="104" r="27" fill="url(#gloss)"/>
      <g class="ico" transform="translate(287 93)">
        <rect x="1.2" y="1.2" width="7.4" height="7.4" rx="1.6"/>
        <rect x="13.4" y="13.4" width="7.4" height="7.4" rx="1.6"/>
        <path d="M8.6 4.9h5.6a2.8 2.8 0 0 1 2.8 2.8v5.7"/>
      </g>
      <text x="298" y="152" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,sans-serif"
            font-size="14" font-weight="700" fill="#F1F5F9">Arquitectura</text>
      <text x="298" y="171" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,sans-serif"
            font-size="11.5" font-weight="600" fill="#64748B">Contrato OpenAPI</text>
    </g>

    <!-- 03 Desarrollo -->
    <g class="step s3">
      <circle cx="500" cy="104" r="27" fill="#121A1D" stroke="#548D7B" stroke-opacity="0.35"/>
      <circle cx="500" cy="104" r="27" fill="url(#gloss)"/>
      <g class="ico" transform="translate(489 93)">
        <path d="M7.4 5.6 2.2 11l5.2 5.4M14.6 5.6 19.8 11l-5.2 5.4"/>
      </g>
      <text x="500" y="152" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,sans-serif"
            font-size="14" font-weight="700" fill="#F1F5F9">Desarrollo</text>
      <text x="500" y="171" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,sans-serif"
            font-size="11.5" font-weight="600" fill="#64748B">Sprints · BDD</text>
    </g>

    <!-- 04 CI/CD -->
    <g class="step s4">
      <circle cx="702" cy="104" r="27" fill="#121A1D" stroke="#548D7B" stroke-opacity="0.35"/>
      <circle cx="702" cy="104" r="27" fill="url(#gloss)"/>
      <g class="ico" transform="translate(691 93)">
        <path d="M2.4 11a8.6 8.6 0 0 1 14.7-6.1M19.6 11a8.6 8.6 0 0 1-14.7 6.1"/>
        <path d="M17.6 1.4v3.6h-3.6M4.4 20.6V17h3.6"/>
      </g>
      <text x="702" y="152" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,sans-serif"
            font-size="14" font-weight="700" fill="#F1F5F9">CI/CD</text>
      <text x="702" y="171" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,sans-serif"
            font-size="11.5" font-weight="600" fill="#64748B">Lint · Test · Build</text>
    </g>

    <!-- 05 Soporte -->
    <g class="step s5">
      <circle cx="904" cy="104" r="27" fill="#121A1D" stroke="#548D7B" stroke-opacity="0.35"/>
      <circle cx="904" cy="104" r="27" fill="url(#gloss)"/>
      <g class="ico" transform="translate(893 93)">
        <path d="M11 20.2s8-4.4 8-10.4V4.2L11 1.6 3 4.2v5.6c0 6 8 10.4 8 10.4Z"/>
        <path d="m7.8 10.4 2.3 2.3 4.1-4.4"/>
      </g>
      <text x="904" y="152" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,sans-serif"
            font-size="14" font-weight="700" fill="#F1F5F9">Soporte</text>
      <text x="904" y="171" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,sans-serif"
            font-size="11.5" font-weight="600" fill="#64748B">Sentry · Logs</text>
    </g>

    <!-- numeración -->
    <g font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="11" font-weight="700"
       letter-spacing="1.4" fill="#548D7B" text-anchor="middle" opacity="0.85">
      <text class="step s1" x="96"  y="58">01</text>
      <text class="step s2" x="298" y="58">02</text>
      <text class="step s3" x="500" y="58">03</text>
      <text class="step s4" x="702" y="58">04</text>
      <text class="step s5" x="904" y="58">05</text>
    </g>
  </g>
</svg>
